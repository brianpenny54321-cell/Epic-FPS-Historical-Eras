<style>
html,body{margin:0;width:100%;height:100%;background:#071015;color:#eaf1ef;font-family:system-ui,-apple-system,sans-serif}
#preflight{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 65% 40%,#12313a 0,#071015 55%,#03070a 100%);padding:28px}
