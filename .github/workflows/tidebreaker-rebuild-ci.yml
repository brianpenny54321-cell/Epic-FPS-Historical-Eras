name: Tidebreaker rebuild CI
on:
  push:
    branches: [tidebreaker-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -s dist/index.html && test -s dist/src/main.js && test -s dist/src/style.css
